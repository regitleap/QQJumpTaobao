name: Build QQJumpTaobao

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beer-psi/setup-theos@v1.7.0
        with:
          theos-version: latest

      - name: Build tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: QQJumpTaobao
          path: ./packages/*.deb
