name: Build QQJumpTaobao

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      PATH: ${{ github.workspace }}/theos/bin:/usr/local/bin:/usr/bin:/bin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl libcurl4-openssl-dev libssl-dev ldid

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Build tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: QQJumpTaobao
          path: ./packages/*.deb
